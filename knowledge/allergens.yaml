review_notes:
  - 甲壳类：设计文档只写了“甲壳类”，但它举的蚝油是贝类做的。这里把贝类、鱿鱼墨鱼章鱼也归进来，标签改叫“甲壳类与贝类”。如果要分成两类，需要同时改设计文档的标签。
  - 牛油：川式火锅里的牛油是牛脂，不含奶；粤语地区的牛油指黄油。按宁可误杀一律算奶。
  - 麸质：酱油、蚝油、豆瓣酱、甜面酱、海鲜酱通常含小麦，已算进麸质；燕麦常有交叉污染，也算进。这会让麸质过敏的用户很难拿到中餐推荐，模型会改用无麸质酱油等替代，请确认能接受。
  - 单字关键词“面”“饼”“蛋”“奶”“鱼”“虾”“蟹”“贝”“螺”“蚝”“蛤”范围很大，靠 except 排除了已知的误伤（鱼香、椰奶、eggplant 等），请补充你想到的其他误伤。
  - 坚果：栗子在美国 FDA 的清单里算坚果，这里也算；椰子不算。
  - 大豆：只匹配明确的豆制品，没有用单字“豆”，因为绿豆、红豆、土豆都会误伤。
