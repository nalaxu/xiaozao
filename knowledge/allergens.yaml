# 过敏原类别与食材关键词（技术方案 7.5）
# 用途：用户在“忌口与过敏”里选了某类过敏原后，推荐和教程的食材清单里出现任一关键词就判为不能用（宁可误杀）。
# 匹配方式：食材中英文名先统一成小写，先去掉 except 里的词，再看是否包含 keywords 里的任一词。
#   except 只作用于本类别：例如“椰奶”只在检查“奶”时被排除，不会影响别的类别。
#   except 要写完整的词：写“无麸质酱油”而不是“无麸质”，否则去掉“无麸质”后剩下的“酱油”仍会命中。
# 关键词宁多勿少：多一个词最多误删一道菜，少一个词可能让过敏的人吃到。
# 审核：请重点看 review_notes，以及每类有没有漏掉海外常见的成品酱料。

